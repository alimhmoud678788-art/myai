# Real end-to-end test of the local AI engine on Windows: downloads llama.cpp + the Lite model,
# starts llama-server with the SAME arguments as src-tauri/src/engine.rs, and checks an Arabic answer.
name: Engine test

on:
  push:
    branches: [main]
    paths:
      - src-tauri/src/engine.rs
      - scripts/fetch-llama.ps1
      - .github/workflows/engine-test.yml
  workflow_dispatch:

jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      STANDARD_URL: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      LITE_URL: https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4

      - name: Fetch llama.cpp engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-llama.ps1 -Dest engine

      - name: Model download links are valid
        shell: bash
        run: |
          set +e
          for u in "$STANDARD_URL" "$LITE_URL"; do
            code=$(curl -sIL -o /dev/null -w "%{http_code}" "$u"); rc=$?
            echo "curl=$rc http=$code $u"
            [ "$rc" = "0" ] && [ "$code" = "200" ] || { echo "::error title=model-url::not reachable (curl=$rc http=$code): $u"; exit 1; }
          done

      - name: Download Lite model
        shell: bash
        run: |
          set +e
          curl -sSL --retry 5 -o lite.gguf "$LITE_URL"; rc=$?
          [ "$rc" = "0" ] || { echo "::error title=download::curl exit $rc"; exit 1; }
          head -c 4 lite.gguf | grep -q GGUF || { echo "::error title=download::not a GGUF file: $(head -c 120 lite.gguf)"; exit 1; }
          ls -l lite.gguf

      # One step, so the background server is alive for every check.
      - name: Run engine with the app's arguments and test it
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          fail() { echo "::error title=$1::$2 | server: $(tail -n 6 server.err 2>/dev/null | tr '\r\n' '  ' | cut -c1-600)"; exit 1; }
          ./engine/llama-server.exe -m lite.gguf --host 127.0.0.1 --port 18080 --api-key testkey -c 8192 --jinja --no-webui \
            > server.out 2> server.err &
          PID=$!
          for i in $(seq 1 120); do
            kill -0 $PID 2>/dev/null || fail start "llama-server exited"
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health)" = "200" ] && break
            sleep 2
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health)" = "200" ] || fail start "not ready after 4 minutes"
          echo "server ready"

          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H "Content-Type: application/json" -d '{"messages":[{"role":"user","content":"hi"}]}')
          [ "$code" = "401" ] || fail api-key "expected 401 without API key, got $code"

          curl -s -i -X OPTIONS http://127.0.0.1:18080/v1/chat/completions -H "Origin: http://tauri.localhost" \
            -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" > preflight.txt
          grep -qi "access-control-allow-origin" preflight.txt || fail cors "preflight: $(head -c 300 preflight.txt | tr '\r\n' '  ')"

          printf '%s' '{"messages":[{"role":"system","content":"You are MyAI. Reply in the user'"'"'s language."},{"role":"user","content":"عرّف نفسك في جملة واحدة."}],"stream":true,"temperature":0.7,"top_p":0.8,"max_tokens":200,"cache_prompt":true,"chat_template_kwargs":{"enable_thinking":false}}' > req.json
          curl -sN http://127.0.0.1:18080/v1/chat/completions -H "Authorization: Bearer testkey" \
            -H "Content-Type: application/json" -H "Origin: http://tauri.localhost" --data-binary @req.json > stream.txt
          grep -q '^data: ' stream.txt || fail chat "no SSE data: $(head -c 300 stream.txt)"
          grep -q '\[DONE\]' stream.txt || fail chat "stream did not finish"
          python - <<'PY'
          import json, re
          text = ""
          for line in open("stream.txt", encoding="utf-8"):
              line = line.strip()
              if line.startswith("data: ") and line != "data: [DONE]":
                  text += json.loads(line[6:])["choices"][0]["delta"].get("content") or ""
          print("ANSWER:", text)
          print("::notice title=Arabic answer::" + text.replace("\n", " ")[:300])
          if not re.search(r"[\u0600-\u06FF]{3,}", text):
              print("::error title=chat::answer has no Arabic text")
              raise SystemExit(1)
          PY
          rc=$?
          kill $PID 2>/dev/null
          exit $rc

      - name: Server log on failure
        if: failure()
        shell: bash
        run: tail -60 server.err || true
