# Builds the Windows installer (.exe NSIS + .msi), signs updater artifacts,
# and publishes a GitHub Release with latest.json for the auto-updater.
# Trigger: bump "version" in src-tauri/tauri.conf.json + package.json, then push main to the
# `release` branch (git push origin main:release). The action creates the vX.Y.Z tag and release.
name: Release

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The updater key is committed ENCRYPTED (src-tauri/updater.key.encrypted, random 192-bit password).
      # Only the password is a secret. Without it the installer still builds, just without update signatures.
      - name: Updater signing
        id: sign
        shell: bash
        env:
          PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$(tr -d '\r\n' < src-tauri/updater.key.encrypted)" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret not set: building without auto-update artifacts."
            echo "args=--config src-tauri/tauri.nosign.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ steps.sign.outputs.args }}
          tagName: v__VERSION__
          releaseName: "MyAI v__VERSION__"
          releaseBody: "⬇️ Download **MyAI_x.y.z_x64-setup.exe** below, run it, and paste your free Gemini key (aistudio.google.com/apikey) on first launch."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
